<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Analyzing Package</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-tertiary-container": "#b08d5b",
                        "border-subtle": "#c5c6cf",
                        "on-secondary-fixed": "#151c22",
                        "status-red-bg": "#ffebee",
                        "primary-container": "#1a2b4b",
                        "surface-container-low": "#f2f3f9",
                        "primary-fixed-dim": "#b6c6ef",
                        "secondary-container": "#dae0e9",
                        "on-secondary-fixed-variant": "#41484e",
                        "on-tertiary-fixed-variant": "#5d4217",
                        "on-secondary-container": "#5c636a",
                        "on-tertiary": "#ffffff",
                        "status-red-text": "#b71c1c",
                        "surface-container-high": "#e7e8ee",
                        "primary-fixed": "#d8e2ff",
                        "on-surface": "#191c20",
                        "on-background": "#191c20",
                        "on-primary": "#ffffff",
                        "tertiary-fixed-dim": "#e8c08a",
                        "secondary": "#585f66",
                        "status-green-text": "#1b5e20",
                        "surface-container-lowest": "#ffffff",
                        "status-amber-text": "#e65100",
                        "outline-variant": "#c5c6cf",
                        "surface-tint": "#4e5e81",
                        "secondary-fixed-dim": "#c0c7cf",
                        "surface-dim": "#d8dae0",
                        "tertiary-fixed": "#ffddb1",
                        "tertiary-container": "#3e2700",
                        "surface-variant": "#e1e2e8",
                        "status-amber-bg": "#fff3e0",
                        "error-container": "#ffdad6",
                        "on-surface-variant": "#44474e",
                        "inverse-surface": "#2e3135",
                        "surface": "#f8f9ff",
                        "on-primary-container": "#8293b8",
                        "inverse-primary": "#b6c6ef",
                        "secondary-fixed": "#dce3eb",
                        "inverse-on-surface": "#eff0f6",
                        "on-primary-fixed": "#081b3a",
                        "outline": "#75777f",
                        "tertiary": "#231400",
                        "background": "#f8f9ff",
                        "surface-bright": "#f8f9ff",
                        "on-secondary": "#ffffff",
                        "error": "#ba1a1a",
                        "on-error": "#ffffff",
                        "surface-container": "#eceef3",
                        "status-green-bg": "#e8f5e9",
                        "surface-container-highest": "#e1e2e8",
                        "primary": "#031635",
                        "on-tertiary-fixed": "#291800",
                        "on-primary-fixed-variant": "#364768",
                        "on-error-container": "#93000a"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "gutter": "16px",
                        "margin-x": "16px",
                        "stack-md": "12px",
                        "stack-sm": "8px",
                        "base": "8px",
                        "tight": "4px"
                    },
                    "fontFamily": {
                        "body-md": ["Inter"],
                        "label-caps": ["Inter"],
                        "headline-lg": ["Inter"],
                        "body-sm": ["Inter"],
                        "section-header": ["Inter"],
                        "caption": ["Inter"]
                    },
                    "fontSize": {
                        "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "label-caps": ["12px", { "lineHeight": "16px", "letterSpacing": "0.02em", "fontWeight": "600" }],
                        "headline-lg": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],

                }
            }
        }
    </script>
<style>
        @keyframes pulse-slow {
            0%, 100% { opacity: 1; }
            50% { opacity: .7; }
        }
        .animate-pulse-slow {
            animation: pulse-slow 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface text-on-surface h-screen flex flex-col font-body-md">
<!-- Header / Nav Shell is suppressed as this is a linear/transactional processing screen -->
<main class="flex-1 flex flex-col items-center justify-center p-margin-x">
<div class="w-full max-w-md bg-surface-container-lowest border border-border-subtle rounded-DEFAULT p-6 shadow-sm relative overflow-hidden">
<!-- Subtle top border accent for focus state -->
<div class="absolute top-0 left-0 w-full h-1 bg-primary"></div>
<div class="mb-8 text-center flex flex-col items-center">
<span class="material-symbols-outlined text-4xl text-primary mb-stack-md animate-pulse-slow" data-weight="fill" style="font-variation-settings: 'FILL' 1;">
                    query_stats
                </span>
<h1 class="font-headline-lg text-headline-lg text-primary mb-stack-sm">Analyzing Package</h1>
<p class="font-body-sm text-body-sm text-secondary">Processing 2/3 images...</p>
</div>
<div class="space-y-4">
<!-- Step 1: Done -->
<div class="flex items-start">
<span class="material-symbols-outlined text-status-green-text mr-stack-md mt-0.5" data-weight="fill" style="font-variation-settings: 'FILL' 1;">check_circle</span>
<div class="flex-1">
<p class="font-body-md text-body-md text-on-surface">Images uploaded</p>
</div>
</div>
<!-- Step 2: Done -->
<div class="flex items-start">
<span class="material-symbols-outlined text-status-green-text mr-stack-md mt-0.5" data-weight="fill" style="font-variation-settings: 'FILL' 1;">check_circle</span>
<div class="flex-1">
<p class="font-body-md text-body-md text-on-surface">Image quality checked</p>
</div>
</div>
<!-- Step 3: Done -->
<div class="flex items-start">
<span class="material-symbols-outlined text-status-green-text mr-stack-md mt-0.5" data-weight="fill" style="font-variation-settings: 'FILL' 1;">check_circle</span>
<div class="flex-1">
<p class="font-body-md text-body-md text-on-surface">Reading package text</p>
</div>
</div>
<!-- Step 4: Active -->
<div class="flex items-start">
<span class="material-symbols-outlined text-primary mr-stack-md mt-0.5 animate-spin">progress_activity</span>
<div class="flex-1">
<div class="flex justify-between mb-tight">
<p class="font-body-md text-body-md text-primary font-medium">Extracting declarations</p>
<span class="font-caption text-caption text-secondary">45%</span>
</div>
<div class="w-full bg-surface-variant rounded-full h-1.5 overflow-hidden border border-border-subtle">
<div class="bg-primary h-1.5 rounded-full w-[45%] transition-all duration-500 ease-out"></div>
</div>
</div>
</div>
<!-- Step 5: Pending -->
<div class="flex items-start opacity-50">
<span class="material-symbols-outlined text-secondary mr-stack-md mt-0.5">radio_button_unchecked</span>
<div class="flex-1">
<p class="font-body-md text-body-md text-secondary">Checking compliance rules</p>
</div>
</div>
</div>
<div class="mt-8 pt-4 border-t border-border-subtle flex justify-center">
<button class="border border-primary bg-transparent text-primary hover:bg-surface-container-low font-label-caps text-label-caps px-4 py-2 rounded-DEFAULT transition-colors" type="button">
                    CANCEL ANALYSIS
                 </button>
</div>
</div>
</main>
<script src="../app.js"></script>
</body></html>
