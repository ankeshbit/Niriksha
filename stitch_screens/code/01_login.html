<main class="w-full max-w-[400px] bg-surface-container-lowest border border-border-subtle rounded-lg flex flex-col">
<!-- Header Section -->
<div class="px-margin-x pt-stack-md pb-stack-sm border-b border-border-subtle flex flex-col items-center text-center"><span class="material-symbols-outlined text-[48px] text-primary mb-stack-sm" data-icon="assured_workload">assured_workload</span><h1 class="font-headline-lg text-headline-lg text-primary mb-tight">LEGAL METROLOGY</h1><p class="font-body-sm text-body-sm text-on-surface-variant">AI-Assisted Legal Metrology Inspection</p></div>
<!-- Form Section -->
<form action="#" class="p-margin-x flex flex-col gap-stack-md" method="POST">
<div class="flex flex-col gap-tight">
<label class="font-label-caps text-label-caps text-on-surface-variant" for="inspector-id">Inspector ID / Username</label>
<input class="w-full bg-surface-bright border border-border-subtle rounded px-3 py-base font-body-md text-on-surface focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-colors" id="inspector-id" name="inspector-id" required="" type="text">
</div>
<div class="flex flex-col gap-tight"><label class="font-label-caps text-label-caps text-on-surface-variant" for="password">Password</label><div class="relative w-full"><input class="w-full bg-surface-bright border border-border-subtle rounded px-3 py-base font-body-md text-on-surface focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-colors pr-10" id="password" name="password" required="" type="password"><button type="button" class="absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-primary flex items-center"><span class="material-symbols-outlined text-[20px]" id="toggle-password-icon">visibility</span></button></div></div>
<div id="error-message" class="hidden flex items-center gap-tight p-3 bg-status-red-bg text-status-red-text rounded border border-error/20 font-body-sm"><span class="material-symbols-outlined text-[18px]">error</span><span class="">Invalid Inspector ID or password. Please try again.</span></div><button class="w-full mt-stack-sm bg-primary text-on-primary font-section-header text-section-header py-base rounded hover:bg-primary-container transition-colors duration-200 flex justify-center items-center gap-tight" type="submit"><span class="button-text flex items-center gap-tight"><span class="">Sign In</span><span class="material-symbols-outlined text-[18px]">login</span></span><span class="loading-spinner hidden animate-spin material-symbols-outlined text-[18px]">progress_activity</span></button>
</form>
